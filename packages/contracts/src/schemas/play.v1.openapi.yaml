openapi: 3.0.3
info:
  title: SuperEngine Play API
  version: 1.0.0
  description: |
    The Wrapper's API, served under `/play/v1`. Design-first: this document
    is the contract. A breaking change creates `/play/v2`; `/play/v1` never
    takes one.

    **Authentication.** The Wrapper exchanges the launch code from the launch
    URL for a play token (`sessions:redeem`, the only unauthenticated route),
    then sends `Authorization: Bearer <playToken>` on every other call. A play
    token is a short-lived handle to one session, never a login; refresh it
    before `tokenExpiresAt`. A credential of another surface is refused before
    any handler runs.

    **Errors** are `application/problem+json` with a typed `code` and a
    `retryable` hint. Branch on `code`, never on `title` or `detail`; treat an
    unknown `code` as unspecific and fall back on `status` and `retryable`.
    `SESSION_EXPIRED` and `SESSION_REVOKED` end the session: ask the operator's
    page for a new launch.

    **Field names** are lowerCamelCase. Request bodies are decoded strictly:
    an unknown field is a 400. The body limit is 1 MiB. Responses that carry a
    token are `Cache-Control: no-store`.
servers:
  - url: /
security:
  - playToken: []
tags:
  - name: sessions
    description: The play token of a session.
  - name: rounds
    description: The session's rounds, and the Snapshot the game renders.
paths:
  /play/v1/sessions:redeem:
    post:
      operationId: redeemLaunchCode
      summary: Exchange a launch code for a play token
      description: |
        Redeems the single-use launch code of a launch URL and returns the
        session's first play token and the origin to frame the game at. A code
        is redeemed at most once: a second call, an expired code, and an
        unknown code are the same 401. A lost response cannot be repeated; the
        player needs a new launch.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "200":
          description: The session is active.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /play/v1/sessions:refresh:
    post:
      operationId: refreshPlayToken
      summary: Refresh the play token
      description: |
        Issues a new play token for the session of the presented one. The
        presented token keeps its own expiry; every older token of the session
        is revoked, so a refresh retried after a lost response works again. A
        refresh does not reset the session's idle timeout. Send no body.
      tags: [sessions]
      responses:
        "200":
          description: The new play token.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /play/v1/rounds:start:
    post:
      operationId: startRound
      summary: Start a round
      description: |
        Starts a round of the session's game and answers its Snapshot where the
        engine stopped: `starting`, `active`, or a terminal status. Idempotent by
        `idempotencyKey`: the same key and body answer the stored round, even
        when it has ended; the same key with another body is `CONFLICT`. A new
        key while a round is open is `ROUND_ACTIVE`, with that round's Snapshot.
        A round voided or refused before any money moved answers the problem of
        its code (for example `FUNDING_UNCONFIRMED`, `ENTROPY_UNAVAILABLE`),
        never a Snapshot; retry such a start with a new key. `actionKey` is the
        address the shell signs the round's actions with: it is sealed with the
        round and cannot change during it.
      tags: [rounds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRoundRequest" }
      responses:
        "200":
          description: The round's Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /play/v1/rounds:continue:
    post:
      operationId: continueRound
      summary: Play a move
      description: |
        Passes the player's signed move (`PlayerAction`) to the engine, which
        verifies it, and answers the round's Snapshot: `active` again, or the
        terminal status the move led to. The API passes the action through
        unread: only the engine verifies it. Repeating an accepted action
        answers the round; another action signed at an accepted sequence
        number is `STALE_ACTION`. For now, the engine's own stale refusals (a
        wrong `sequence` or `previous`) answer `INVALID_ARGUMENT`.
      tags: [rounds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundActionRequest" }
      responses:
        "200":
          description: The round's Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /play/v1/rounds:cashOut:
    post:
      operationId: cashOutRound
      summary: Cash out
      description: |
        Passes the player's signed cash-out (`PlayerCashOut`) and answers the
        round's Snapshot, `won` once the engine closed it. The same rules as
        `rounds:continue`.
      tags: [rounds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundActionRequest" }
      responses:
        "200":
          description: The round's Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /play/v1/rounds:cancel:
    post:
      operationId: cancelRound
      summary: Cancel the round
      description: |
        Passes the player's signed cancel (`PlayerCancel`, `sequence` 1, its
        `previous` the Snapshot's `readyHash`) and answers the round's
        Snapshot: `canceled` once the engine accepted it, the bet refunded or
        its refund on the way. `canceled` is final: the status never changes
        again. When the engine has not answered the cancel yet, the answer is
        `resolving` (no pick, no reveal): read `GET /play/v1/snapshot` again.
        It shows `resolving` until the engine answers, `active` when a move
        was applied first or the cancel was refused, and `idle` once the round
        has ended (planned: the round's final status, see
        `GET /play/v1/snapshot`). Only an `active` round with no move played
        can be canceled. The API passes the cancel through unread: only the
        engine verifies it.

        A cancel after a move was applied, or of a round that is not
        `active` (a cancel still `resolving` included), is
        `FAILED_PRECONDITION`. A cancel the engine refuses (a
        wrong signer, `sequence` or `previous`) is `INVALID_ARGUMENT` and
        leaves the round `active`, so a corrected cancel may follow. When a
        move was accepted while the cancel was on its way, the answer is the
        round's Snapshot with that move played, and nothing is refunded.

        A cancel is not answered from a log as a repeated move is: once the
        engine took it, the same cancel again is `FAILED_PRECONDITION`. After
        a lost response or `UNAVAILABLE`, read `GET /play/v1/snapshot` before
        sending it again.
      tags: [rounds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundActionRequest" }
      responses:
        "200":
          description: The round's Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /play/v1/snapshot:
    get:
      operationId: getSnapshot
      summary: Read the Snapshot
      description: |
        Answers the session's Snapshot: its open round, or `idle` when none is
        open. A round that has ended is not shown again: its Snapshot was the
        answer of the call that ended it. Planned: the session's most recent
        round, ended rounds included, until the next `rounds:start`; `idle`
        with no error then means the session has no round yet, and with a
        typed error a voided or rejected round. Reading does not reset the
        session's idle timeout.
      tags: [rounds]
      responses:
        "200":
          description: The session's Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    playToken:
      type: http
      scheme: bearer
      description: The play token, `pt_` + 43 base64url characters.
  schemas:
    RedeemRequest:
      type: object
      additionalProperties: false
      required: [launchCode]
      properties:
        launchCode:
          type: string
          description: The launch code from the launch URL's fragment, `lc_` + 43 base64url characters. Secret.
          minLength: 1
          maxLength: 128
    RedeemResponse:
      type: object
      additionalProperties: false
      required: [sessionId, playToken, tokenExpiresAt, sessionExpiresAt, gameOrigin]
      properties:
        sessionId:
          type: string
          pattern: "^ses_[0-9a-f]{32}$"
        playToken:
          type: string
          description: The bearer token of the other routes. Secret.
        tokenExpiresAt:
          type: string
          format: date-time
        sessionExpiresAt:
          type: string
          format: date-time
          description: The session's hard end; no token outlives it.
        gameOrigin:
          type: string
          minLength: 1
          maxLength: 267
          description: >-
            The origin to frame the game at, and the only origin to exchange
            messages with: a serialized origin with no path, such as
            `https://games.example.com`, exactly as a browser reports it in
            `event.origin`. It is the same for the whole session. Frame the
            game only if it is on your own allow-list.
          example: https://games.example.com
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [playToken, tokenExpiresAt]
      properties:
        playToken:
          type: string
          description: The new bearer token. Secret.
        tokenExpiresAt:
          type: string
          format: date-time
    StartRoundRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, bet, actionKey]
      properties:
        idempotencyKey:
          type: string
          description: The client's key of this start, unique per session. A repeat with the same key and body answers the stored round.
          minLength: 1
          maxLength: 128
        bet:
          $ref: "#/components/schemas/AmountRequest"
        actionKey:
          type: string
          description: The 20-byte address the shell signs the round's actions with, `0x` + 40 hex digits. Never the zero address.
          pattern: "^0x[0-9a-fA-F]{40}$"
        shape:
          type: array
          description: The config shape, the number of options of each step, for a game whose package does not fix it. Leave it out for a game that does (Coin Flip, Cash or Crash).
          maxItems: 25
          items:
            type: integer
            minimum: 1
            maximum: 25
    RoundActionRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, roundId, typedData, signature]
      properties:
        idempotencyKey:
          type: string
          description: The client's key of this call, 1 to 128 characters. For a move or a cash-out, the signed action's sequence number is what makes a repeat safe; a cancel is not repeated (see `rounds:cancel`). The key is accepted for every transport's sake.
          minLength: 1
          maxLength: 128
        roundId:
          $ref: "#/components/schemas/RoundId"
        typedData:
          type: string
          format: byte
          description: The canonical Protocol v1 encoding of the action's typed data (`ActionTypedData`), base64. Passed to the engine as is.
          minLength: 1
          maxLength: 4096
        signature:
          type: string
          description: The 65-byte signature `r || s || v` over the action's EIP-712 digest, `0x` + 130 hex digits.
          pattern: "^0x[0-9a-fA-F]{130}$"
    # BEGIN snapshotgen
    # Generated from the Snapshot JSON Schema (se.snapshot/1). Do not edit between these markers.
    Snapshot:
      description: "se.snapshot/1: the one document every game client renders. Closed objects everywhere: a field that is not listed here can never be served (an allow-list)."
      type: object
      required: [schema, version, presentation, model, context, status, bet, config]
      additionalProperties: false
      properties:
        schema:
          type: string
          enum: [se.snapshot/1]
        version:
          description: "Per-session, monotonically increasing Snapshot counter. Not the schema version."
          type: integer
          minimum: 0
        presentation:
          description: "Client contract the game renders: steps (StepConfig) or playback (BookConfig)."
          type: string
          x-extensible-enum: [steps, playback]
        model:
          description: "Game model behind the round. Informational; the client branches on presentation."
          type: string
          x-extensible-enum: [config, book]
        context:
          $ref: "#/components/schemas/SessionContext"
        status:
          $ref: "#/components/schemas/RoundStatus"
        closeReason:
          description: "Why a terminal round closed, when it did not close by play. Shown next to status, never a status of its own."
          type: string
          x-extensible-enum: [expired]
        roundId:
          $ref: "#/components/schemas/RoundId"
        bet:
          $ref: "#/components/schemas/BetContext"
        step:
          description: "Progress through the round: 0 .. steps.length (steps presentation only)."
          type: integer
          minimum: 0
        currentMultiplier:
          $ref: "#/components/schemas/Multiplier"
        bankedAmount:
          $ref: "#/components/schemas/Amount"
        config:
          $ref: "#/components/schemas/GameConfig"
        proofs:
          $ref: "#/components/schemas/FairnessContext"
    RoundStatus:
      description: "Round lifecycle phase. New values only behind a client capability flag."
      type: string
      x-extensible-enum: [idle, starting, active, resolving, won, lost, canceled]
    RoundId:
      description: "UUIDv7, canonical lowercase text form."
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    RoundIdBytes32:
      description: "The roundId in its on-chain bytes32 form: the 16 UUIDv7 bytes left-aligned, zero-padded."
      type: string
      pattern: "^0x[0-9a-f]{12}7[0-9a-f]{3}[89ab][0-9a-f]{15}0{32}$"
    Hash32:
      description: "32 bytes, 0x-prefixed lowercase hex."
      type: string
      pattern: "^0x[0-9a-f]{64}$"
    HttpsUrl:
      type: string
      pattern: "^https://[^\\s]+$"
      maxLength: 2048
    BaseUnits:
      description: "Non-negative integer in the token's smallest unit, base-10, no sign, no leading zeros, at most 2^256-1. The pattern is the exact range: any value of up to 77 digits, or a 78-digit value not above 2^256-1 (115792089237316195423570985008687907853269984665640564039457584007913129639935)."
      type: string
      pattern: "^(0|[1-9][0-9]{0,76}|10[0-9]{76}|11[0-4][0-9]{75}|115[0-6][0-9]{74}|1157[0-8][0-9]{73}|11579[0-1][0-9]{72}|1157920[0-7][0-9]{70}|11579208[0-8][0-9]{69}|115792089[0-1][0-9]{68}|1157920892[0-2][0-9]{67}|11579208923[0-6][0-9]{66}|115792089237[0-2][0-9]{65}|11579208923730[0-9]{64}|11579208923731[0-5][0-9]{63}|1157920892373160[0-9]{62}|1157920892373161[0-8][0-9]{61}|11579208923731619[0-4][0-9]{60}|115792089237316195[0-3][0-9]{59}|1157920892373161954[0-1][0-9]{58}|11579208923731619542[0-2][0-9]{57}|115792089237316195423[0-4][0-9]{56}|1157920892373161954235[0-6][0-9]{55}|115792089237316195423570[0-8][0-9]{53}|1157920892373161954235709[0-7][0-9]{52}|11579208923731619542357098[0-4][0-9]{51}|11579208923731619542357098500[0-7][0-9]{48}|115792089237316195423570985008[0-5][0-9]{47}|1157920892373161954235709850086[0-7][0-9]{46}|11579208923731619542357098500868[0-6][0-9]{45}|115792089237316195423570985008687[0-8][0-9]{44}|11579208923731619542357098500868790[0-6][0-9]{42}|115792089237316195423570985008687907[0-7][0-9]{41}|1157920892373161954235709850086879078[0-4][0-9]{40}|11579208923731619542357098500868790785[0-2][0-9]{39}|115792089237316195423570985008687907853[0-1][0-9]{38}|1157920892373161954235709850086879078532[0-5][0-9]{37}|11579208923731619542357098500868790785326[0-8][0-9]{36}|115792089237316195423570985008687907853269[0-8][0-9]{35}|1157920892373161954235709850086879078532699[0-7][0-9]{34}|11579208923731619542357098500868790785326998[0-3][0-9]{33}|115792089237316195423570985008687907853269984[0-5][0-9]{32}|1157920892373161954235709850086879078532699846[0-5][0-9]{31}|11579208923731619542357098500868790785326998466[0-4][0-9]{30}|115792089237316195423570985008687907853269984665[0-5][0-9]{29}|1157920892373161954235709850086879078532699846656[0-3][0-9]{28}|115792089237316195423570985008687907853269984665640[0-4][0-9]{26}|1157920892373161954235709850086879078532699846656405[0-5][0-9]{25}|11579208923731619542357098500868790785326998466564056[0-3][0-9]{24}|1157920892373161954235709850086879078532699846656405640[0-2][0-9]{22}|11579208923731619542357098500868790785326998466564056403[0-8][0-9]{21}|115792089237316195423570985008687907853269984665640564039[0-3][0-9]{20}|1157920892373161954235709850086879078532699846656405640394[0-4][0-9]{19}|11579208923731619542357098500868790785326998466564056403945[0-6][0-9]{18}|115792089237316195423570985008687907853269984665640564039457[0-4][0-9]{17}|1157920892373161954235709850086879078532699846656405640394575[0-7][0-9]{16}|11579208923731619542357098500868790785326998466564056403945758[0-3][0-9]{15}|11579208923731619542357098500868790785326998466564056403945758400[0-6][0-9]{12}|115792089237316195423570985008687907853269984665640564039457584007[0-8][0-9]{11}|11579208923731619542357098500868790785326998466564056403945758400790[0-9]{10}|11579208923731619542357098500868790785326998466564056403945758400791[0-2][0-9]{9}|1157920892373161954235709850086879078532699846656405640394575840079130[0-9]{8}|1157920892373161954235709850086879078532699846656405640394575840079131[0-1][0-9]{7}|11579208923731619542357098500868790785326998466564056403945758400791312[0-8][0-9]{6}|115792089237316195423570985008687907853269984665640564039457584007913129[0-5][0-9]{5}|1157920892373161954235709850086879078532699846656405640394575840079131296[0-2][0-9]{4}|11579208923731619542357098500868790785326998466564056403945758400791312963[0-8][0-9]{3}|115792089237316195423570985008687907853269984665640564039457584007913129639[0-8][0-9]{2}|1157920892373161954235709850086879078532699846656405640394575840079131296399[0-2][0-9]|11579208923731619542357098500868790785326998466564056403945758400791312963993[0-4]|115792089237316195423570985008687907853269984665640564039457584007913129639935)$"
      maxLength: 78
    Unit:
      description: "Currency code from the engine's currency registry, e.g. EUR, ETH, USDT-TRON."
      type: string
      pattern: "^[A-Z0-9]{2,10}(-[A-Z0-9]{2,10})?$"
    Multiplier:
      description: "Payout multiplier for display. Never used for money math; amounts come as Amount."
      type: number
      format: double
      minimum: 0
    Amount:
      type: object
      required: [value, decimals, unit, normalized, formatted]
      additionalProperties: false
      properties:
        value:
          $ref: "#/components/schemas/BaseUnits"
        decimals:
          type: integer
          minimum: 0
          maximum: 77
        unit:
          $ref: "#/components/schemas/Unit"
        normalized:
          description: "Display-only number. Never used for money math."
          type: number
          format: double
        formatted:
          type: string
          minLength: 1
          maxLength: 64
    AmountRequest:
      description: "An amount sent by the client. Only the money-bearing fields; normalized and formatted are response-only and rejected. decimals is optional and, when present, must equal the registry scale of unit (checked by the server, not by this schema)."
      type: object
      required: [value, unit]
      additionalProperties: false
      properties:
        value:
          $ref: "#/components/schemas/BaseUnits"
        decimals:
          type: integer
          minimum: 0
          maximum: 77
        unit:
          $ref: "#/components/schemas/Unit"
    SessionContext:
      description: "Launch context. No player ID, no operator token."
      type: object
      required: [sessionId, language, device, theme]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          pattern: "^ses_[0-9A-Za-z]{1,64}$"
        language:
          description: "Lowercase ISO 639 code."
          type: string
          pattern: "^[a-z]{2,3}$"
        country:
          description: "ISO 3166-1 alpha-2."
          type: string
          pattern: "^[A-Z]{2}$"
        device:
          type: string
          x-extensible-enum: [desktop, mobile]
        links:
          type: object
          additionalProperties: false
          properties:
            lobby:
              $ref: "#/components/schemas/HttpsUrl"
            deposit:
              $ref: "#/components/schemas/HttpsUrl"
        theme:
          $ref: "#/components/schemas/Theme"
        view:
          description: "Personalization filled per the game's developer-defined schema. Opaque to the engine contract, except that no key may name a player identifier or an operator token (the same rule as SessionContext)."
          type: object
    Theme:
      type: object
      additionalProperties: false
      properties:
        appearance:
          type: string
          x-extensible-enum: [dark, light]
        colorPalette:
          type: object
        tileStyles:
          type: object
    BetContext:
      type: object
      required: [balance, minBet, maxBet, suggestedBets, defaultBet]
      additionalProperties: false
      properties:
        balance:
          $ref: "#/components/schemas/Amount"
        minBet:
          $ref: "#/components/schemas/Amount"
        maxBet:
          $ref: "#/components/schemas/Amount"
        suggestedBets:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/Amount"
        defaultBet:
          $ref: "#/components/schemas/Amount"
    GameConfig:
      description: "PUBLIC round configuration. Never contains unresolved outcomes."
      oneOf:
        - $ref: "#/components/schemas/StepConfig"
        - $ref: "#/components/schemas/BookConfig"
    StepConfig:
      type: object
      required: [kind, steps]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [steps]
        steps:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/Step"
    Step:
      type: object
      required: [index, optionCount, multiplier]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        optionCount:
          type: integer
          minimum: 2
        multiplier:
          $ref: "#/components/schemas/Multiplier"
        selectedIndex:
          description: "The player's pick, once they acted."
          type: integer
          minimum: 0
        losingIndex:
          description: "The losing option. Present only after this step (or the whole round) resolved."
          type: integer
          minimum: 0
    BookConfig:
      description: "playback presentation. Placeholder in se.snapshot/1: the shape is frozen; its details are not specified yet."
      type: object
      required: [kind, packageHash, model]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [book]
        packageHash:
          $ref: "#/components/schemas/Hash32"
        model:
          description: "Stake mode name from the package's index.json."
          type: string
          minLength: 1
          maxLength: 64
        draw:
          $ref: "#/components/schemas/BookDraw"
    BookDraw:
      type: object
      required: [index, payoutMultiplier, events]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        payoutMultiplier:
          $ref: "#/components/schemas/Multiplier"
        events:
          type: array
          items:
            $ref: "#/components/schemas/BookEvent"
    BookEvent:
      type: object
      required: [index, type]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        type:
          type: string
          minLength: 1
          maxLength: 64
        data:
          description: "Shape defined by the math package."
    FairnessContext:
      type: object
      required: [randomnessProof]
      additionalProperties: false
      properties:
        fairnessProof:
          $ref: "#/components/schemas/FairnessProof"
        randomnessProof:
          $ref: "#/components/schemas/RandomnessProof"
        createRoundAuth:
          $ref: "#/components/schemas/CreateRoundAuth"
        record:
          $ref: "#/components/schemas/OnChainRecord"
    FairnessProof:
      description: "Config rounds only."
      type: object
      required: [seedHash]
      additionalProperties: false
      properties:
        seedHash:
          $ref: "#/components/schemas/Hash32"
        readyHash:
          $ref: "#/components/schemas/Hash32"
        seed:
          $ref: "#/components/schemas/Hash32"
        zkProof:
          $ref: "#/components/schemas/ZKProofRef"
    RandomnessProof:
      type: object
      required: [source, blockNumber, roundSecretHash]
      additionalProperties: false
      properties:
        source:
          description: "Entropy source identifier."
          type: string
          pattern: "^[a-z0-9][a-z0-9:_-]{0,63}$"
        blockNumber:
          type: integer
          minimum: 0
        blockValue:
          $ref: "#/components/schemas/Hash32"
        blockExplorerUrl:
          $ref: "#/components/schemas/HttpsUrl"
        roundSecretHash:
          $ref: "#/components/schemas/Hash32"
        roundSecret:
          $ref: "#/components/schemas/Hash32"
        zkProof:
          $ref: "#/components/schemas/ZKProofRef"
    OnChainRecord:
      type: object
      required: [chainId, roundId, txHash]
      additionalProperties: false
      properties:
        chainId:
          type: integer
          minimum: 1
        roundId:
          $ref: "#/components/schemas/RoundIdBytes32"
        txHash:
          $ref: "#/components/schemas/Hash32"
        explorerUrl:
          $ref: "#/components/schemas/HttpsUrl"
    CreateRoundAuth:
      description: "Config rounds only, required from the bind on: the round creation authorization, an EIP-712 signature by the registry admin key over CreateRoundAuth(bytes32 created,uint40 prepareWindow,uint256 expiry), where created = keccak256(abi.encode(newRound)). The same object on every read of the round. domain and signer are the round's own values; a client trusts them only when they equal the values pinned in its own configuration."
      type: object
      required: [newRound, entropyChainId, prepareWindow, expiry, domain, signer, signature]
      additionalProperties: false
      properties:
        newRound:
          $ref: "#/components/schemas/NewRound"
        entropyChainId:
          description: "Chain of the entropy source. Not signed itself: with randomnessProof.source and blockNumber it recomputes newRound.randomnessTarget."
          type: integer
          minimum: 1
          maximum: 9007199254740991
        prepareWindow:
          description: "The signed prepareWindow (uint40), in seconds."
          type: integer
          minimum: 0
          maximum: 1099511627775
        expiry:
          $ref: "#/components/schemas/Uint256"
        domain:
          $ref: "#/components/schemas/RegistryDomain"
        signer:
          $ref: "#/components/schemas/Address"
        signature:
          $ref: "#/components/schemas/Signature65"
    NewRound:
      description: "The signed round, field by field, in abi.encode order: 11 static words (352 bytes) whose keccak256 is created. Every word is needed to recompute created."
      type: object
      required: [roundId, playerRef, currency, betAmount, gameId, gameVersion, circuitVersion, roundSecretHash, randomnessTarget, actionKey, payoutTermsHash]
      additionalProperties: false
      properties:
        roundId:
          $ref: "#/components/schemas/RoundIdBytes32"
        playerRef:
          $ref: "#/components/schemas/Hash32"
        currency:
          $ref: "#/components/schemas/Unit"
        betAmount:
          $ref: "#/components/schemas/Uint128"
        gameId:
          description: "uint32."
          type: integer
          minimum: 0
          maximum: 4294967295
        gameVersion:
          description: "uint32."
          type: integer
          minimum: 0
          maximum: 4294967295
        circuitVersion:
          description: "uint32."
          type: integer
          minimum: 0
          maximum: 4294967295
        roundSecretHash:
          $ref: "#/components/schemas/Hash32"
        randomnessTarget:
          $ref: "#/components/schemas/Hash32"
        actionKey:
          $ref: "#/components/schemas/Address"
        payoutTermsHash:
          $ref: "#/components/schemas/Hash32"
    RegistryDomain:
      description: "The EIP-712 domain of the round's registry, fixed when the round is bound."
      type: object
      required: [name, version, chainId, verifyingContract]
      additionalProperties: false
      properties:
        name:
          type: string
          enum: [SuperEngine]
        version:
          type: string
          enum: ["1"]
        chainId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        verifyingContract:
          $ref: "#/components/schemas/Address"
    Address:
      description: "EVM address, 20 bytes, 0x-prefixed lowercase hex (no checksum casing; compare as bytes)."
      type: string
      pattern: "^0x[0-9a-f]{40}$"
    Signature65:
      description: "secp256k1 signature r || s || v, 65 bytes, 0x-prefixed lowercase hex, v is 27 (1b) or 28 (1c). A low s is checked by the verifier, not by this pattern."
      type: string
      pattern: "^0x[0-9a-f]{128}(1b|1c)$"
    Uint128:
      description: "Non-negative integer, base-10, no sign, no leading zeros, at most 2^128-1 (340282366920938463463374607431768211455). The pattern is the exact range."
      type: string
      pattern: "^(0|[1-9][0-9]{0,37}|[1-2][0-9]{38}|3[0-3][0-9]{37}|340[0-1][0-9]{35}|3402[0-7][0-9]{34}|34028[0-1][0-9]{33}|340282[0-2][0-9]{32}|3402823[0-5][0-9]{31}|34028236[0-5][0-9]{30}|340282366[0-8][0-9]{29}|3402823669[0-1][0-9]{28}|340282366920[0-8][0-9]{26}|3402823669209[0-2][0-9]{25}|34028236692093[0-7][0-9]{24}|340282366920938[0-3][0-9]{23}|3402823669209384[0-5][0-9]{22}|34028236692093846[0-2][0-9]{21}|340282366920938463[0-3][0-9]{20}|3402823669209384634[0-5][0-9]{19}|34028236692093846346[0-2][0-9]{18}|340282366920938463463[0-2][0-9]{17}|3402823669209384634633[0-6][0-9]{16}|34028236692093846346337[0-3][0-9]{15}|340282366920938463463374[0-5][0-9]{14}|34028236692093846346337460[0-6][0-9]{12}|340282366920938463463374607[0-3][0-9]{11}|3402823669209384634633746074[0-2][0-9]{10}|340282366920938463463374607430[0-9]{9}|340282366920938463463374607431[0-6][0-9]{8}|3402823669209384634633746074317[0-5][0-9]{7}|34028236692093846346337460743176[0-7][0-9]{6}|340282366920938463463374607431768[0-1][0-9]{5}|34028236692093846346337460743176820[0-9]{4}|340282366920938463463374607431768210[0-9]{3}|340282366920938463463374607431768211[0-3][0-9]{2}|3402823669209384634633746074317682114[0-4][0-9]|34028236692093846346337460743176821145[0-4]|340282366920938463463374607431768211455)$"
      maxLength: 39
    Uint256:
      description: "Non-negative integer that is not money, base-10, no sign, no leading zeros, at most 2^256-1: the grammar of BaseUnits."
      type: string
      pattern: "^(0|[1-9][0-9]{0,76}|10[0-9]{76}|11[0-4][0-9]{75}|115[0-6][0-9]{74}|1157[0-8][0-9]{73}|11579[0-1][0-9]{72}|1157920[0-7][0-9]{70}|11579208[0-8][0-9]{69}|115792089[0-1][0-9]{68}|1157920892[0-2][0-9]{67}|11579208923[0-6][0-9]{66}|115792089237[0-2][0-9]{65}|11579208923730[0-9]{64}|11579208923731[0-5][0-9]{63}|1157920892373160[0-9]{62}|1157920892373161[0-8][0-9]{61}|11579208923731619[0-4][0-9]{60}|115792089237316195[0-3][0-9]{59}|1157920892373161954[0-1][0-9]{58}|11579208923731619542[0-2][0-9]{57}|115792089237316195423[0-4][0-9]{56}|1157920892373161954235[0-6][0-9]{55}|115792089237316195423570[0-8][0-9]{53}|1157920892373161954235709[0-7][0-9]{52}|11579208923731619542357098[0-4][0-9]{51}|11579208923731619542357098500[0-7][0-9]{48}|115792089237316195423570985008[0-5][0-9]{47}|1157920892373161954235709850086[0-7][0-9]{46}|11579208923731619542357098500868[0-6][0-9]{45}|115792089237316195423570985008687[0-8][0-9]{44}|11579208923731619542357098500868790[0-6][0-9]{42}|115792089237316195423570985008687907[0-7][0-9]{41}|1157920892373161954235709850086879078[0-4][0-9]{40}|11579208923731619542357098500868790785[0-2][0-9]{39}|115792089237316195423570985008687907853[0-1][0-9]{38}|1157920892373161954235709850086879078532[0-5][0-9]{37}|11579208923731619542357098500868790785326[0-8][0-9]{36}|115792089237316195423570985008687907853269[0-8][0-9]{35}|1157920892373161954235709850086879078532699[0-7][0-9]{34}|11579208923731619542357098500868790785326998[0-3][0-9]{33}|115792089237316195423570985008687907853269984[0-5][0-9]{32}|1157920892373161954235709850086879078532699846[0-5][0-9]{31}|11579208923731619542357098500868790785326998466[0-4][0-9]{30}|115792089237316195423570985008687907853269984665[0-5][0-9]{29}|1157920892373161954235709850086879078532699846656[0-3][0-9]{28}|115792089237316195423570985008687907853269984665640[0-4][0-9]{26}|1157920892373161954235709850086879078532699846656405[0-5][0-9]{25}|11579208923731619542357098500868790785326998466564056[0-3][0-9]{24}|1157920892373161954235709850086879078532699846656405640[0-2][0-9]{22}|11579208923731619542357098500868790785326998466564056403[0-8][0-9]{21}|115792089237316195423570985008687907853269984665640564039[0-3][0-9]{20}|1157920892373161954235709850086879078532699846656405640394[0-4][0-9]{19}|11579208923731619542357098500868790785326998466564056403945[0-6][0-9]{18}|115792089237316195423570985008687907853269984665640564039457[0-4][0-9]{17}|1157920892373161954235709850086879078532699846656405640394575[0-7][0-9]{16}|11579208923731619542357098500868790785326998466564056403945758[0-3][0-9]{15}|11579208923731619542357098500868790785326998466564056403945758400[0-6][0-9]{12}|115792089237316195423570985008687907853269984665640564039457584007[0-8][0-9]{11}|11579208923731619542357098500868790785326998466564056403945758400790[0-9]{10}|11579208923731619542357098500868790785326998466564056403945758400791[0-2][0-9]{9}|1157920892373161954235709850086879078532699846656405640394575840079130[0-9]{8}|1157920892373161954235709850086879078532699846656405640394575840079131[0-1][0-9]{7}|11579208923731619542357098500868790785326998466564056403945758400791312[0-8][0-9]{6}|115792089237316195423570985008687907853269984665640564039457584007913129[0-5][0-9]{5}|1157920892373161954235709850086879078532699846656405640394575840079131296[0-2][0-9]{4}|11579208923731619542357098500868790785326998466564056403945758400791312963[0-8][0-9]{3}|115792089237316195423570985008687907853269984665640564039457584007913129639[0-8][0-9]{2}|1157920892373161954235709850086879078532699846656405640394575840079131296399[0-2][0-9]|11579208923731619542357098500868790785326998466564056403945758400791312963993[0-4]|115792089237316195423570985008687907853269984665640564039457584007913129639935)$"
      maxLength: 78
    ZKProofRef:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          x-extensible-enum: [pending, processing, verified, failed]
        proofRef:
          $ref: "#/components/schemas/Hash32"
        verifiedBy:
          type: string
          x-extensible-enum: [superengine, zkverify, onchain]
        txHash:
          $ref: "#/components/schemas/Hash32"
        proofLink:
          $ref: "#/components/schemas/HttpsUrl"
    ErrorCode:
      type: string
      x-extensible-enum: [INSUFFICIENT_FUNDS, LIMIT_EXCEEDED, PLAYER_RESTRICTED, FUNDING_UNCONFIRMED, ENTROPY_UNAVAILABLE, PREPARATION_TIMEOUT, SIGNED_START_FAILED, LANE_LIMIT, ROUND_VOIDED, ROUND_ACTIVE, SESSION_EXPIRED, SESSION_REVOKED, STALE_ACTION, INVALID_ARGUMENT, NOT_FOUND, CONFLICT, FAILED_PRECONDITION, UNAUTHENTICATED, PERMISSION_DENIED, UNAVAILABLE, UNIMPLEMENTED, INTERNAL, UNKNOWN]
    PlayProblem:
      description: "Play API error: RFC 9457 problem+json plus a typed code and retryable flag."
      type: object
      required: [type, title, status, code, retryable]
      additionalProperties: false
      properties:
        type:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        retryable:
          type: boolean
        snapshot:
          $ref: "#/components/schemas/Snapshot"
    # END snapshotgen
  responses:
    BadRequest:
      description: The request is malformed (`INVALID_ARGUMENT`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
    Unauthorized:
      description: |
        No valid credential: `UNAUTHENTICATED` (a missing, malformed, unknown,
        or used credential), `SESSION_EXPIRED`, or `SESSION_REVOKED`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
    NotFound:
      description: No such route (`NOT_FOUND`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
    InternalError:
      description: A server fault (`INTERNAL`). The cause is logged, never returned.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
    Unavailable:
      description: |
        A dependency is unavailable (`UNAVAILABLE`), or the round was voided
        before it could start (`FUNDING_UNCONFIRMED`, `ENTROPY_UNAVAILABLE`,
        `PREPARATION_TIMEOUT`, `ROUND_VOIDED`). Retryable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
    Conflict:
      description: |
        `ROUND_ACTIVE` (a round is open: resume it from the problem's
        `snapshot`), `CONFLICT` (the key was used with another body), or
        `STALE_ACTION` (another action at an accepted sequence number: the
        action was signed for a state the round has left; resync from the
        Snapshot). For now, `STALE_ACTION` is sent only for that case: the
        engine's own stale refusals (a wrong `sequence` or `previous`) answer
        `INVALID_ARGUMENT` (400).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
    Unprocessable:
      description: |
        The request cannot be served as it is: `LIMIT_EXCEEDED` or
        `FAILED_PRECONDITION` (for example the round is not active, new rounds
        are blocked, or the operator refused the debit).
        `INSUFFICIENT_FUNDS` and `PLAYER_RESTRICTED` are not sent yet: for
        now a debit the operator refused is `FAILED_PRECONDITION`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlayProblem" }
