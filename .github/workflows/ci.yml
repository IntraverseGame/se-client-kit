name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No job gets a token unless it asks for one below.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No task cache in CI: every job runs its scripts from a clean checkout, with
  # no cache helper step and no cache credentials. It was turned off for a
  # wireit cache bug (#53; google/wireit#1536), and stays off after the upgrade
  # to wireit 0.15.0, which fixes it (#143): the time saved is not worth the
  # helper step and its credentials. The release-dry-run job, which already
  # builds with no cache, takes about 35s (specs/client-kit/testing-and-ci.md).
  WIREIT_CACHE: none
  # One line per script (run or already fresh), which the default CI logger
  # drops.
  WIREIT_LOGGER: simple

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Every dependency in every package.json must be on the ADR-001 allow-list.
  allow-list:
    name: allow-list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run check:deps

  # The hash check against the lock file and the regenerated-types diff arrive
  # with the `contracts` package. `contracts-drift` waits for a published source.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run check:contracts

  # The Wrapper's build writes and checks its manifest. check:build-output
  # inspects every dist/ (no vector, no test file, only intended outputs);
  # check:package-files holds each library's package.json files field to its
  # dist/; check:size-budget holds the Wrapper's release output to its size
  # budget (tools/size-budget.ts).
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - run: pnpm run check:build-output
      - run: pnpm run check:package-files
      - run: pnpm run check:size-budget

  # The release dry run (tools/release-dry-run.ts): changesets applied on a
  # scratch copy, the five tarballs packed and checked (exports, no vector,
  # nothing of the contracts test-only entry), the packed packages imported as
  # a consumer would, the Wrapper artifact built twice with one digest, and the
  # Wrapper's size budget. It publishes nothing and needs no token.
  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The CLI directly, not `pnpm release:dry-run -- --out ...`: wireit
      # passes extra arguments to a `shell: true` spawn unescaped (Node's
      # DEP0190 warning).
      - run:
          pnpm exec tsx tools/release-dry-run.ts --out
          "$RUNNER_TEMP/release-dry-run"

  # Playwright against the in-repo fake Play API (e2e/), one job per project
  # (chromium, firefox, webkit), side by side, on every change. Each job
  # installs only its own browser, from Playwright's own download for the
  # @playwright/test the lockfile pins (lifecycle scripts are off, so it is
  # installed here), and runs only that project (SE_E2E_PROJECT, read by the
  # e2e package's test script). ci-ok needs every one of them.
  e2e-fake:
    name: e2e-fake (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      SE_E2E_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Installs finish in under a minute at the median but can take many
      # minutes on a slow mirror, and a stalled download has hung until the job
      # timeout (PR #129, firefox). The apt timeouts make a stalled download
      # fail fast (and apt retries it); the cap bounds the total time of one
      # attempt. One retry, after clearing what a killed attempt left behind;
      # a second failure or timeout fails the job. coreutils `timeout`, no
      # extra action or dependency.
      - name: Install the browser (bounded, one retry)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "3";' \
            'DPkg::Lock::Timeout "60";' |
            sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          install_browser() {
            timeout --kill-after=15s 10m \
              pnpm --filter @intraverse/se-client-e2e exec playwright install \
              --with-deps "$SE_E2E_PROJECT"
          }
          install_browser || {
            echo "::warning::browser install failed or timed out; retrying once"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
            install_browser
          }
      - run: pnpm run test:e2e

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Required by ci-ok, but fails only on high and critical advisories.
      - run: pnpm audit --prod --audit-level high

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The one aggregate check to keep green before merging (the `main` ruleset
  # requires no status check).
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
      - format
      - typecheck
      - unit
      - allow-list
      - contracts
      - build
      - release-dry-run
      - e2e-fake
      - audit
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All required jobs passed."
