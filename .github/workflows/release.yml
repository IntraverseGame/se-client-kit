name: Release

# Runs on every push to `main` (ADR-009; runbook/client-kit-release.md,
# Release), with no concurrency group: GitHub keeps one pending run per group,
# so a group would let a later push cancel the bump merge's waiting run. Each
# push's run is independent and checks out its own commit.
#
#   - `changesets-mode` (`contents: read`, `pull-requests: read`; no
#     environment, no secret, no repository tooling: the runner's shell, git,
#     gh, and jq) decides, read-only, whether changesets are pending
#     (`pending`), and whether the pushed commit is the squash merge of the bump
#     pull request (`changeset-release/main` from this repository, merged into
#     `main`) with no changeset pending and a publishable version above 0.0.0
#     that has no tag yet (`release-candidate`).
#   - `version` (only when `pending`; no environment; `contents: write` and
#     `pull-requests: write`; no `id-token`) runs changesets/action in version
#     mode: `changeset version` and the version-file guard
#     (tools/release-version.sh), then the "chore: bump versions" pull request
#     from `changeset-release/main`. Made with the job token, that pull request
#     starts no workflow run (accepted: CI runs on `main` after the merge).
#   - `publish` (only on a release candidate and with the repository variable
#     RELEASE_PUBLISH_ENABLED `true`; environment `release`, whose required
#     reviewers approve it; `contents: write` and `id-token: write`; no
#     `pull-requests`) checks again that a version is still untagged, runs
#     `pnpm check` and the release dry run, then changesets/action in publish
#     mode: tools/release-publish.ts publishes with npm trusted publishing (no
#     npm token anywhere) and tags every released package; the action pushes
#     the tags (and creates no release); the job's last step checks that every
#     tag is on this commit and only then creates a GitHub release for each.
#   - `wrapper-build` (`contents: read`), `attest` (environment `attest`), and
#     `wrapper-assets` (`contents: write`, no repository code) run only while
#     the Wrapper's release has no tar attached: they build the Wrapper artifact twice (one digest),
#     attest it, and attach it and its `.sha256` to the Wrapper's release
#     (ADR-005, decisions 1 to 5).
#   - `production` deploys that release to production
#     (.github/workflows/pages-prod.yml, which verifies its attestation first).
#
# The usual push is neither: the run ends in `changesets-mode` with a "nothing
# to release" notice. A release candidate while publishing is off ends with a
# "publishing was off" notice; the recovery is a manual re-run of the bump
# merge's run within 30 days, once publishing is on (runbook).
on:
  push:
    branches: [main]

# No job gets a token unless it asks for one below.
permissions: {}

env:
  # No task cache (#53): a release build never restores from a cache. wireit
  # already defaults to none on CI, and the release build steps set it too;
  # this states it for every job.
  WIREIT_CACHE: none

jobs:
  changesets-mode:
    name: changesets-mode
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The checkout.
      contents: read
      # The pull request associated with the pushed commit.
      pull-requests: read
    outputs:
      pending: ${{ steps.mode.outputs.pending }}
      release-candidate: ${{ steps.mode.outputs.release-candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pending changesets: the `.changeset/*.md` files other than its
      # README.md. With none pending, the pushed commit is the bump merge when
      # a pull request associated with it (GET
      # /repos/{owner}/{repo}/commits/{sha}/pulls) has head ref
      # `changeset-release/main` in this repository (so a fork's branch of the
      # same name cannot match), base `main`, was merged, and its merge commit
      # is this very commit. This assumes the repository squash-merges, so the
      # check never looks for a second parent; a true merge commit of the bump
      # pull request would also pass, which is harmless because GitHub
      # records that merge commit as the pull request's `merge_commit_sha`, so
      # it is still the one commit on `main` that carries exactly the reviewed
      # bump, and the release then tags and publishes that commit. Then each
      # publishable package's `<name>@<version>` tag
      # is looked up with `git ls-remote` on the public URL (no registry, no
      # token); a version 0.0.0 never counts. Any API or git error fails the
      # step, so an error is never read as "nothing to release".
      # tools/release-mode.test.ts runs this script.
      - name: Decide what this push releases
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pending=false
          for file in .changeset/*.md; do
            if [ "$file" != .changeset/README.md ]; then
              pending=true
            fi
          done
          bump=false
          if [ "$pending" = false ]; then
            merges="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" --jq '.[] | select(.head.ref == "changeset-release/main" and .head.repo.full_name == env.GITHUB_REPOSITORY and .base.ref == "main" and .merged_at != null and .merge_commit_sha == env.GITHUB_SHA) | .number')"
            if [ -n "$merges" ]; then
              bump=true
            fi
          fi
          untagged=""
          if [ "$bump" = true ]; then
            for manifest in packages/contracts/package.json packages/signing/package.json \
              packages/snapshot/package.json packages/play-client/package.json \
              packages/shell/package.json apps/wrapper/package.json; do
              name="$(jq --raw-output '.name' "$manifest")"
              version="$(jq --raw-output '.version' "$manifest")"
              if ! [[ $name =~ ^@intraverse/se-client-[a-z-]+$ && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Unexpected name or version in ${manifest}."
                exit 1
              fi
              if [ "$version" = 0.0.0 ]; then
                continue
              fi
              tag="refs/tags/${name}@${version}"
              found="$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false ls-remote --tags \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$tag" |
                awk -v tag="$tag" '$2 == tag || $2 == tag "^{}"')"
              if [ -z "$found" ]; then
                untagged="${untagged} ${name}@${version}"
              fi
            done
          fi
          candidate=false
          if [ -n "$untagged" ]; then
            candidate=true
          fi
          {
            echo "pending=${pending}"
            echo "release-candidate=${candidate}"
          } >> "$GITHUB_OUTPUT"
          if [ "$pending" = true ]; then
            echo "Changesets are pending: the version job opens or updates the bump pull request."
          elif [ "$candidate" = true ] && [ "${RELEASE_PUBLISH_ENABLED:-}" = true ]; then
            echo "Release candidate, untagged:${untagged}"
          elif [ "$candidate" = true ]; then
            echo "::notice::Publishing was off: nothing was published for${untagged}. Re-run this run within 30 days once RELEASE_PUBLISH_ENABLED is true (runbook/client-kit-release.md, Release)."
          else
            echo "::notice::Nothing to release: this push is not the bump merge, or every publishable version is tagged or 0.0.0."
          fi

  # The bump pull request. Repository tooling (`changeset version`, its
  # changelog generator, the formatter, the version-file guard) runs here with
  # a write token, accepted by ADR-009; no environment and no OIDC token, so
  # nothing here can publish or attest.
  version:
    name: version
    needs: changesets-mode
    if: needs.changesets-mode.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The changeset-release/main branch (its commit is made through the API).
      contents: write
      # The bump pull request, opened or updated.
      pull-requests: write
    steps:
      # The whole history: changesets finds the commit that added each
      # changeset for the changelog. No credential is left in .git/config: the
      # action pushes through the API with its `github-token` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No cache: no wireit helper and no pnpm store restore in a release job.
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # Version mode (no `publish-script`). The version script runs
      # `changeset version` and refuses anything it does not write
      # (tools/release-version-guard.sh); the action commits the result on
      # `changeset-release/main` and opens or updates the pull request.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bash tools/release-version.sh
          commit-message: "chore: bump versions"
          pr-title: "chore: bump versions"

  # The release. Only for the bump merge with an untagged version, only with
  # publishing on, and only after a required reviewer of `release` approves.
  publish:
    name: publish
    needs: changesets-mode
    if: >-
      needs.changesets-mode.outputs.release-candidate == 'true' &&
      vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      # The tags (through the action) and the GitHub releases (the step after
      # it).
      contents: write
      # npm trusted publishing and provenance: the job's OIDC token, exchanged
      # by npm; no npm token is stored anywhere.
      id-token: write
    outputs:
      wrapper-tag: ${{ steps.releases.outputs.wrapper-tag }}
    steps:
      # With the tags: for the Wrapper, released means tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      # The tags were read when `changesets-mode` ran, and this job may have
      # waited for the reviewers; a re-run after a release, or any duplicate,
      # finds them tagged and publishes nothing (only the releases step below
      # still runs, to finish a partial release).
      # tools/release-publish-steps.test.ts runs this script.
      - name: Check that a version is still untagged
        id: recheck
        shell: bash
        run: |
          set -euo pipefail
          untagged=""
          for manifest in packages/contracts/package.json packages/signing/package.json \
            packages/snapshot/package.json packages/play-client/package.json \
            packages/shell/package.json apps/wrapper/package.json; do
            name="$(jq --raw-output '.name' "$manifest")"
            version="$(jq --raw-output '.version' "$manifest")"
            if ! [[ $name =~ ^@intraverse/se-client-[a-z-]+$ && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Unexpected name or version in ${manifest}."
              exit 1
            fi
            if [ "$version" = 0.0.0 ]; then
              continue
            fi
            tag="refs/tags/${name}@${version}"
            found="$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false ls-remote --tags \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$tag" |
              awk -v tag="$tag" '$2 == tag || $2 == tag "^{}"')"
            if [ -z "$found" ]; then
              untagged="${untagged} ${name}@${version}"
            fi
          done
          if [ -z "$untagged" ]; then
            echo "::notice::Already released: every publishable version is tagged; nothing was published."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Untagged:${untagged}"
          echo "release=true" >> "$GITHUB_OUTPUT"
      # No cache: no wireit helper and no pnpm store restore in a release job.
      - uses: ./.github/actions/setup
        if: steps.recheck.outputs.release == 'true'
        with:
          cache: "false"
      - name: Check the repository
        if: steps.recheck.outputs.release == 'true'
        shell: bash
        run: pnpm check
      # npm trusted publishing needs npm 11.5.1 or later: an older npm (a
      # changed .node-version) fails here, by name, before anything is
      # published. tools/release-npm-version.test.ts runs this script.
      - name: Require npm 11.5.1 or later
        if: steps.recheck.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm --version)"
          if [[ ! $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Unexpected npm version: ${version}"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))) )); then
            echo "::error::npm ${version} cannot publish with trusted publishing: it needs 11.5.1 or later, which the pinned Node brings."
            exit 1
          fi
          echo "npm ${version}"
      # The release dry run on this commit: the Wrapper built twice with one
      # digest, which the publish command requires its own build to match.
      # The CLI directly, not `pnpm release:dry-run -- --out ...`: wireit
      # passes extra arguments to a `shell: true` spawn unescaped (Node's
      # DEP0190 warning).
      - name: Run the release dry run
        id: dry-run
        if: steps.recheck.outputs.release == 'true'
        shell: bash
        run:
          pnpm exec tsx tools/release-dry-run.ts --out
          "$RUNNER_TEMP/release-dry-run"
      # Publish mode (no changeset is pending). The publish command
      # (tools/release-publish.ts --publish) refuses what is not ready, runs
      # `npm publish` on each checked tarball not yet on the registry
      # (provenance, public access, lifecycle scripts off), then
      # `changeset git-tag`, which tags every package whose version has no
      # tag (the Wrapper, and a library published before a failed run). The
      # action pushes those tags through the API, on this commit. It creates
      # no GitHub release (`create-github-releases: false`): v2.1.2 only warns
      # when a tag push fails, and a release created for a missing tag would
      # tag the default branch's head instead (ADR-009; the human,
      # 2026-10-28). The next step creates them, after checking the tags.
      - name: Publish and tag
        id: changesets
        if: steps.recheck.outputs.release == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: >-
            pnpm exec tsx tools/release-publish.ts --publish --out ${{
            runner.temp }}/publish --expect-wrapper-digest ${{
            steps.dry-run.outputs.wrapper-digest }}
          create-github-releases: false
      # The GitHub releases, made here instead of by the action. First, every
      # tag the action reported (`published-packages`) must exist and point
      # at this run's commit (peeled when annotated); a missing or misplaced
      # tag fails the job before any release is made. Then, for each
      # publishable version whose tag is on this commit and that has no
      # release yet ("re-run failed jobs" finishes a partial release, skipping
      # those that exist), `gh release create` with `--verify-tag` (gh never creates a
      # tag) and `--target` this commit, titled with the tag, its notes the
      # package's CHANGELOG.md section for the version (as the action would
      # write them), a prerelease for a prerelease version. It also runs when
      # the re-check found everything tagged, so "re-run failed jobs" on a run
      # that failed after the tags finishes it. It names the Wrapper's tag while the
      # Wrapper's release has no tar yet, which starts the Wrapper's jobs.
      # Any API or git error fails the step.
      # tools/release-github-releases.test.ts runs this script.
      - name: Create the GitHub releases
        id: releases
        if: >-
          steps.changesets.outputs.published == 'true' ||
          steps.recheck.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        shell: bash
        run: |
          set -euo pipefail
          published="$(jq --raw-output '.[] | "\(.name)@\(.version)"' <<< "${PUBLISHED_PACKAGES:-[]}")"
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | "\(.tag_name)\t\([.assets[].name] | join(" "))"')"
          known=""
          tags=()
          failed=0
          for manifest in packages/contracts/package.json packages/signing/package.json \
            packages/snapshot/package.json packages/play-client/package.json \
            packages/shell/package.json apps/wrapper/package.json; do
            name="$(jq --raw-output '.name' "$manifest")"
            version="$(jq --raw-output '.version' "$manifest")"
            if ! [[ $name =~ ^@intraverse/se-client-[a-z-]+$ && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Unexpected name or version in ${manifest}."
              exit 1
            fi
            tag="${name}@${version}"
            if [ "$version" = 0.0.0 ]; then
              continue
            fi
            known="${known}${tag}"$'\n'
            required=0
            if grep -Fxq -- "$tag" <<< "$published"; then
              required=1
            fi
            ref="refs/tags/${tag}"
            refs="$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false ls-remote --tags \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$ref")"
            commit="$(awk -v ref="$ref" '$2 == ref "^{}" { print $1 }' <<< "$refs")"
            if [ -z "$commit" ]; then
              commit="$(awk -v ref="$ref" '$2 == ref { print $1 }' <<< "$refs")"
            fi
            if [ -z "$commit" ]; then
              if [ "$required" -eq 1 ]; then
                echo "::error::The tag ${tag} does not exist: its push failed. Re-run this run (runbook/client-kit-release.md, Troubleshooting)."
                failed=1
              fi
              continue
            fi
            if [ "$commit" != "$GITHUB_SHA" ]; then
              if [ "$required" -eq 1 ]; then
                echo "::error::The tag ${tag} is on ${commit}, not on this run's commit ${GITHUB_SHA}."
                failed=1
              fi
              continue
            fi
            tags+=("$tag")
          done
          while IFS= read -r entry; do
            if [ -n "$entry" ] && ! grep -Fxq -- "$entry" <<< "$known"; then
              echo "::error::${entry} is not a publishable package's version."
              failed=1
            fi
          done <<< "$published"
          if [ "$failed" -ne 0 ]; then
            echo "::error::No GitHub release was created."
            exit 1
          fi
          wrapper_tag=""
          for tag in "${tags[@]+"${tags[@]}"}"; do
            name="${tag%@*}"
            version="${tag##*@}"
            existing="$(awk -F '\t' -v tag="$tag" '$1 == tag' <<< "$releases")"
            if [ -n "$existing" ]; then
              echo "The release ${tag} exists; skipped."
            else
              if [ "$name" = @intraverse/se-client-wrapper ]; then
                changelog=apps/wrapper/CHANGELOG.md
              else
                changelog="packages/${name#@intraverse/se-client-}/CHANGELOG.md"
              fi
              entry="$(awk -v version="$version" '
                fence != "" { if (index($0, fence) == 1) fence = ""; if (found) print; next }
                /^```/ { match($0, /^`+/); fence = substr($0, 1, RLENGTH); if (found) print; next }
                /^#+ / {
                  match($0, /^#+/); depth = RLENGTH
                  text = substr($0, depth + 2); sub(/[ \t]+$/, "", text)
                  if (found && depth == level) exit
                  if (!found && text == version) { found = 1; level = depth; next }
                }
                found { print }
              ' "$changelog" | sed '/./,$!d')"
              if [ -z "$entry" ]; then
                echo "::error::No changelog entry for ${tag} in ${changelog}."
                exit 1
              fi
              notes="$RUNNER_TEMP/release-notes-${name#@intraverse/}.md"
              printf '%s\n' "$entry" > "$notes"
              prerelease=()
              if [[ $version == *-* ]]; then
                prerelease=(--prerelease)
              fi
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
                --target "$GITHUB_SHA" --title "$tag" "${prerelease[@]+"${prerelease[@]}"}" \
                --notes-file "$notes"
              echo "Created the release ${tag}."
            fi
            if [ "$name" = @intraverse/se-client-wrapper ] &&
              [[ " ${existing#*$'\t'} " != *" se-client-wrapper-${version}.tar "* ]]; then
              wrapper_tag="$tag"
            fi
          done
          if [ -n "$wrapper_tag" ]; then
            echo "wrapper-tag=${wrapper_tag}" >> "$GITHUB_OUTPUT"
          fi

  # The Wrapper artifact of the released commit (the commit the tags point
  # at): built twice with one digest required, and uploaded with its `.sha256`,
  # one file each, not zipped, kept 14 days (ADR-005, decision 5).
  wrapper-build:
    name: wrapper-build
    needs: publish
    if: needs.publish.outputs.wrapper-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      wrapper-digest: ${{ steps.dry-run.outputs.wrapper-digest }}
      wrapper-file-name: ${{ steps.dry-run.outputs.wrapper-file-name }}
      release-tag: ${{ steps.tag.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: no wireit helper and no pnpm store restore in a release job.
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Run the release dry run
        id: dry-run
        shell: bash
        run:
          pnpm exec tsx tools/release-dry-run.ts --out
          "$RUNNER_TEMP/release-dry-run"
      # The artifact's name must be the released version's; and the
      # artifact's path, for the uploads.
      - name: Name the release
        id: tag
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.wrapper-tag }}
          WRAPPER_FILE_NAME: ${{ steps.dry-run.outputs.wrapper-file-name }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^se-client-wrapper-([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)\.tar$'
          if [[ ! $WRAPPER_FILE_NAME =~ $pattern ]]; then
            echo "::error::Unexpected Wrapper artifact name: ${WRAPPER_FILE_NAME}"
            exit 1
          fi
          if [ "@intraverse/se-client-wrapper@${BASH_REMATCH[1]}" != "$RELEASE_TAG" ]; then
            echo "::error::The Wrapper artifact ${WRAPPER_FILE_NAME} is not the released ${RELEASE_TAG}."
            exit 1
          fi
          {
            echo "release-tag=${RELEASE_TAG}"
            echo "wrapper-path=$RUNNER_TEMP/release-dry-run/wrapper/${WRAPPER_FILE_NAME}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.tag.outputs.wrapper-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.tag.outputs.wrapper-path }}.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  # The Wrapper's build-provenance attestation (ADR-005), of the digest
  # `wrapper-build` reported. No checkout and no copy of the tar: the subject
  # is the name and the digest. Its own environment, so its OIDC token can
  # never match a consumer that requires `release`.
  attest:
    name: attest
    needs: wrapper-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: attest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.wrapper-build.outputs.wrapper-file-name }}
          subject-digest: ${{ needs.wrapper-build.outputs.wrapper-digest }}
          push-to-registry: false
          create-storage-record: false

  # The tar and its `.sha256` on the Wrapper's GitHub release, which the
  # action created: the released Wrapper's durable home (ADR-005). It runs no
  # repository code (no checkout).
  wrapper-assets:
    name: wrapper-assets
    needs: [wrapper-build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The release's assets, the only thing this job writes.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.wrapper-build.outputs.wrapper-file-name }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.wrapper-build.outputs.wrapper-file-name }}.sha256
          path: ${{ runner.temp }}/release
      # Exactly one release must have the tag, and it must not have the
      # files yet. It lists every release of the repository, drafts included
      # (the job's token has push access), page by page, and compares each
      # `tag_name` with the tag exactly (jq's `==` on the environment value,
      # no pattern). Any API error fails the step (`set -euo pipefail`), so an
      # error is never read as "no assets". tools/release-assets-guard.test.ts
      # runs this script.
      - name: Find the Wrapper release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.wrapper-build.outputs.release-tag }}
          WRAPPER_FILE_NAME:
            ${{ needs.wrapper-build.outputs.wrapper-file-name }}
        shell: bash
        run: |
          set -euo pipefail
          matches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | [.assets[].name] | @json')"
          count=0
          if [ -n "$matches" ]; then
            count="$(printf '%s\n' "$matches" | wc -l | tr -d ' ')"
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one release for ${RELEASE_TAG}, found ${count}: see runbook/client-kit-release.md, Troubleshooting, \"The wrapper-assets job failed\"."
            exit 1
          fi
          if jq --exit-status --arg tar "$WRAPPER_FILE_NAME" \
            'any(.[]; . == $tar or . == ($tar + ".sha256"))' <<< "$matches" > /dev/null; then
            echo "::error::The release ${RELEASE_TAG} already has the Wrapper's files: see runbook/client-kit-release.md, Troubleshooting, \"The wrapper-assets job failed\"."
            exit 1
          fi
          echo "The release ${RELEASE_TAG} has no Wrapper files yet."
      - name: Attach the Wrapper artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.wrapper-build.outputs.release-tag }}
          WRAPPER_DIGEST: ${{ needs.wrapper-build.outputs.wrapper-digest }}
          WRAPPER_FILE_NAME:
            ${{ needs.wrapper-build.outputs.wrapper-file-name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! $WRAPPER_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected Wrapper digest: ${WRAPPER_DIGEST}"
            exit 1
          fi
          cd "$RUNNER_TEMP/release"
          if [ "$(cat "${WRAPPER_FILE_NAME}.sha256")" != "${WRAPPER_DIGEST#sha256:}  ${WRAPPER_FILE_NAME}" ]; then
            echo "::error::${WRAPPER_FILE_NAME}.sha256 does not name the attested digest."
            exit 1
          fi
          sha256sum --check --strict "${WRAPPER_FILE_NAME}.sha256"
          gh release upload "$RELEASE_TAG" "$WRAPPER_FILE_NAME" "${WRAPPER_FILE_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY"
      # After the upload: the Wrapper release's notes keep the changelog the
      # action wrote, and get the artifact's digest and the
      # `gh attestation verify` command (ADR-005, decision 4; runbook, Verify
      # before and after) appended. The release is read and edited by its
      # exact tag; any API error fails the step, so notes are never written
      # from an error. tools/release-notes-step.test.ts runs this script.
      - name: Add the verify command to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.wrapper-build.outputs.release-tag }}
          WRAPPER_DIGEST: ${{ needs.wrapper-build.outputs.wrapper-digest }}
          WRAPPER_FILE_NAME:
            ${{ needs.wrapper-build.outputs.wrapper-file-name }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' "$body"
            echo "Wrapper artifact \`${WRAPPER_FILE_NAME}\`, digest \`${WRAPPER_DIGEST}\`."
            echo ""
            echo "Verify it (runbook/client-kit-release.md, Verify before and after):"
            echo ""
            echo '```sh'
            echo "gh attestation verify ${WRAPPER_FILE_NAME} \\"
            echo "  --repo ${GITHUB_REPOSITORY} \\"
            echo "  --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml \\"
            echo "  --source-ref refs/heads/main \\"
            echo "  --source-digest ${GITHUB_SHA} \\"
            echo "  --deny-self-hosted-runners"
            echo '```'
          } > "$notes"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"

  # The production deploy of the release just made, in this run (a tag or a
  # release made with the job token starts no other workflow). Its jobs, their
  # permissions, and its concurrency group are in pages-prod.yml; the
  # permissions here are the most those jobs may ask for.
  production:
    name: production
    needs: [wrapper-build, wrapper-assets]
    permissions:
      contents: read
      attestations: read
      actions: read
    uses: ./.github/workflows/pages-prod.yml
    with:
      tag: ${{ needs.wrapper-build.outputs.release-tag }}
