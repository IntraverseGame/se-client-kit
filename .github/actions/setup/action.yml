name: Set up the toolchain
description: >-
  Install the pinned pnpm and Node, turn on wireit's GitHub Actions cache, and
  install the dependencies from the lockfile with lifecycle scripts off. Run
  actions/checkout first.
inputs:
  cache:
    description: >-
      "true" (the default) turns on wireit's GitHub Actions cache helper and the
      pnpm store cache. The release jobs pass "false": a release build restores
      nothing from a cache, and no long-lived helper holding cache credentials
      runs next to a job's other credentials.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # The version comes from the "packageManager" field of package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    # Starts a local helper that hands the job's Actions cache credentials to
    # wireit (WIREIT_CACHE=github, set by each workflow). It reads no repository
    # secret and the credentials never leave the runner.
    - name: Enable wireit caching in GitHub Actions
      if: inputs.cache == 'true'
      uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
    # --ignore-scripts: no lifecycle script runs, a workspace project's own
    # included (allowBuilds covers dependencies only). Nothing in CI needs one:
    # the e2e job installs Playwright's browser with an explicit step.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
